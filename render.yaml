services:
  - type: web
    name: hana-bar-inventory
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hana-bar-inventory-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ENV
        value: production

databases:
  - name: hana-bar-inventory-db
    databaseName: bar_inventory
    plan: free
    region: singapore
    ipAllowList: []
